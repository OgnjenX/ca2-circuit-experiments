name: whitebirch assay evidence
on: [push, pull_request]
jobs:
  frozen-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen source and blocked pre-run record
        run: python experiments/003_whitebirch_intrinsic/verify_readiness.py
      - name: Confirm production remains gated
        shell: bash
        run: |
          set +e
          python experiments/003_whitebirch_intrinsic/verify_readiness.py --require-ready
          result=$?
          set -e
          test "$result" -eq 2
      - name: Install amended assay verification dependencies
        run: python -m pip install -r experiments/003_whitebirch_intrinsic/revisions/002/requirements.txt
      - name: Test amended reset, trace identity and detector gates
        run: python experiments/003_whitebirch_intrinsic/revisions/002/tests_unit.py
      - name: Verify amended frozen inputs and result consistency
        run: python experiments/003_whitebirch_intrinsic/verify_results.py
