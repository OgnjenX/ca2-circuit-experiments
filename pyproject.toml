[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ca2-circuit-experiments"
version = "0.1.0"
description = "Controlled CA2 circuit experiments and reproducible run records"
requires-python = ">=3.12"
dependencies = ["numpy==2.3.5"]

[project.optional-dependencies]
report = ["reportlab==4.4.9", "Pillow==12.3.0"]

[tool.setuptools.packages.find]
where = ["src"]
